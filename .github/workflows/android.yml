  - name: Set up JDK 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Set up Android SDK
    uses: android-actions/setup-android@v2
    with:
      api-level: 33

  - name: Make gradle wrapper executable (if present)
    run: |
      chmod +x gradlew || true

  - name: Ensure Gradle wrapper exists (try to create if missing)
    run: |
      if [ ! -f ./gradlew ]; then
        wget https://services.gradle.org/distributions/gradle-7.5.1-bin.zip -O gradle-7.5.1-bin.zip
        unzip -q gradle-7.5.1-bin.zip -d /tmp
        /tmp/gradle-7.5.1/bin/gradle wrapper --gradle-version 7.5.1 || true
      fi

  - name: Build debug APK
    run: |
      ./gradlew assembleDebug --no-daemon

  - name: Upload APK artifact
    uses: actions/upload-artifact@v4
    with:
      name: app-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
